version: "1"

# ──────────────────────────────────────────────────────────────────────────────
# mcpredict 정책 예시 파일
#
# 사용 방법:
#   cp examples/policies/example.yaml ~/.mcpredict/policies/my_rules.yaml
#   원하는 룰만 남기고 나머지는 삭제하거나 주석 처리 후 저장
#   → 저장 즉시 적용됩니다 (재시작·재빌드 불필요)
#
# 필드 설명:
#   name          룰 고유 식별자 (영문 소문자 + 하이픈)
#   description   룰 설명 (선택)
#   event         PreToolUse | PostToolUse | * (기본값: * = 모두)
#   tool_pattern  도구 이름 정규식 (Bash | WebFetch | Write | .* 등)
#   input_pattern 도구 입력 JSON에 매칭할 정규식 (RE2 문법)
#   action        block | warn
#   reason        차단/경고 사유 메시지
# ──────────────────────────────────────────────────────────────────────────────

rules:

  # ── 예시 1: curl/wget 결과를 쉘에 직접 파이프 ──────────────────────────────
  - name: "block-pipe-to-shell"
    description: "네트워크에서 받은 내용을 쉘에 직접 실행 차단"
    event: "PreToolUse"
    tool_pattern: 'Bash'
    input_pattern: '(?i)(curl|wget|fetch)[^\n]{0,200}\|\s*(sh|bash|zsh|fish)'
    action: "block"
    reason: "curl/wget 결과를 쉘에 파이프하는 것은 원격 코드 실행 위험이 있습니다"

  # ── 예시 2: eval 서브셸 ────────────────────────────────────────────────────
  - name: "block-eval-subshell"
    description: "eval $() 구문 차단"
    event: "PreToolUse"
    tool_pattern: 'Bash'
    input_pattern: 'eval\s*\$\('
    action: "block"
    reason: "eval 서브셸은 임의 코드 주입 경로가 될 수 있습니다"

  # ── 예시 3: / 루트 재귀 삭제 ──────────────────────────────────────────────
  - name: "block-recursive-root-delete"
    description: "rm -rf / 또는 $HOME 삭제 차단"
    event: "PreToolUse"
    tool_pattern: 'Bash'
    input_pattern: 'rm\s+(-rf|-fr)\s+(/[";\s]|/root|~/|\$HOME)'
    action: "block"
    reason: "루트 또는 홈 디렉터리 재귀 삭제는 복구 불가능한 손실을 유발합니다"

  # ── 예시 4: AWS 액세스 키가 URL에 포함된 WebFetch ─────────────────────────
  - name: "block-aws-key-in-url"
    description: "AWS 자격증명이 포함된 URL 요청 차단"
    event: "PreToolUse"
    tool_pattern: 'WebFetch'
    input_pattern: '(AKIA|ABIA|ACCA|ASIA)[A-Z0-9]{16}'
    action: "block"
    reason: "AWS 액세스 키가 WebFetch 요청에 포함되어 있습니다 — 자격증명 유출 가능성"

  # ── 예시 5: 시스템 디렉터리 쓰기 차단 ────────────────────────────────────
  - name: "block-write-to-system-dirs"
    description: "/etc, /bin 등 시스템 경로에 파일 쓰기 차단"
    event: "PreToolUse"
    tool_pattern: 'Write'
    input_pattern: '"file_path"\s*:\s*"/(etc|bin|sbin|usr/bin|boot)/'
    action: "block"
    reason: "시스템 디렉터리 쓰기는 권한 상승 시도일 수 있습니다"

  # ── 예시 6: /etc/passwd·shadow 덮어쓰기 ──────────────────────────────────
  - name: "block-passwd-shadow-write"
    description: "시스템 인증 파일 변조 차단"
    event: "PreToolUse"
    tool_pattern: 'Bash'
    input_pattern: '(?i)(>|tee)\s*/etc/(passwd|shadow|sudoers)'
    action: "block"
    reason: "/etc/passwd·shadow 변조는 권한 상승 경로입니다"

  # ── 예시 7: 외부 주소 + 로컬 경로 포함 WebFetch 경고 ─────────────────────
  - name: "warn-external-fetch-with-local-path"
    description: "로컬 경로가 포함된 외부 URL 요청 경고"
    event: "PreToolUse"
    tool_pattern: 'WebFetch'
    input_pattern: '(?i)https?://[^\s]+.*/(?:home|root|etc|\.ssh|\.aws)/'
    action: "warn"
    reason: "외부 URL에 로컬 경로가 포함되어 있습니다 — 데이터 유출 가능성"
