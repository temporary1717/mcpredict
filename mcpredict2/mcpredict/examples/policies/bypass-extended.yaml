# bypass-extended.yaml — 우회 패턴 추가 정책 (사용자 정의용)
#
# 이 파일은 의도적으로 비어 있다.
#
# Bypass 탐지(14종 + Cyrillic homoglyph + zero-width Unicode)는
# `internal/scanner/bypass.go` 의 코드 패스에서 매 PreToolUse마다
# 자동 평가된다. 매치 시 verdict.Deny + Source:"bypass" 가 발화된다.
# 별도 YAML 룰을 작성할 필요 없음.
#
# 카탈로그: docs/BYPASS_CATALOG.md
#
# 만약 사용자가 추가 우회 패턴을 정책으로 등록하고 싶다면, 이 파일에
# baseline.yaml 과 동일한 스키마(`when.command_regex`, `action: deny`, ...)로
# 룰을 추가하라.

version: 1
rules: []
