# mcpredict 기본 정책 — baseline.yaml
# 작성: 세션-B, 2026-04-26
# 상태: ARCHITECTURE.md v1.1 §4.3 스키마 기반 초안 (검증 V2 키맵 동결 전)
#
# 매칭 키:
#   tool: 도구 이름 (Bash | Write | Edit | Read | WebFetch | Glob | Grep | mcp__* | any)
#   command_regex / file_path_regex / url_regex / args_regex: 도구별
#   contains_secret: scanner.Scan 결과 하나 이상 매치
#   sequence_prior: 동일 세션의 직전 N개 호출 중 매치
#
# intent_check:
#   mode: required_keyword | absent_keyword | none
#   keywords: [...]
#   threshold: int (required: 최소 N개 매치, absent: 최대 N개 미만)
#
# action: allow | warn | deny

version: 1
rules:

  # 시나리오 1: curl|sh 패턴 — 의존성 설치 의도 명시 시에만 통과
  - id: bash-curl-pipe-shell
    description: 외부 스크립트 다운로드 + 즉시 실행. 의존성 설치 의도 명시 필요.
    when:
      tool: Bash
      command_regex: '\bcurl\b[^|]*\|\s*(?:sh|bash|zsh|env)'
    intent_check:
      mode: required_keyword
      keywords: ["install", "설치", "setup", "공식 설치", "official install", "rustup", "nvm", "uv", "bun"]
      threshold: 1
    action: deny
    reason: "외부 스크립트의 직접 실행 패턴이지만 직전 의도에 설치/setup 표명이 없음."

  - id: bash-wget-pipe-shell
    description: wget+pipe도 동일 패턴
    when:
      tool: Bash
      command_regex: '\bwget\b[^|]*\|\s*(?:sh|bash|zsh)'
    intent_check:
      mode: required_keyword
      keywords: ["install", "설치", "setup"]
      threshold: 1
    action: deny
    reason: "외부 스크립트 다운로드+실행. 의도 미표명."

  # 시나리오 2: 자격증명 평문 외부 전송
  - id: secret-in-tool-input
    description: tool_input 자체에 자격증명/PII가 평문으로 들어가는 경우
    when:
      tool: any
      contains_secret: true
    action: deny
    reason: "도구 인자에 자격증명/PII 평문 노출. scanner 매치."

  - id: webfetch-after-secret-read
    description: env/credentials 파일 읽기 직후 외부 fetch — 외부 전송 시그니처
    when:
      tool: WebFetch
      sequence_prior:
        within: 3
        match: { tool: Read, file_path_regex: '(\.env(\.[a-z]+)?$|credentials|\.aws/|\.ssh/id_)' }
    action: deny
    reason: "자격증명 파일 읽기 직후 외부 fetch — 자격증명 외부 전송 패턴."

  - id: bash-env-cat-and-curl
    description: cat .env | curl ... 같은 단일 명령에서 자격증명 외부 전송
    when:
      tool: Bash
      command_regex: '(cat\s+[^|]*\.env|env\s*\|).*\|\s*curl'
    action: deny
    reason: "환경변수/자격증명을 외부로 전송하는 명령."

  # 시나리오 3 (PostToolUse 영역 - injection 모듈 처리 — 정책 룰로도 보조)
  - id: webfetch-suspicious-domain
    description: 알려진 안전하지 않은 출처 (예: HTTP, 사용자 입력 직삽 도메인)
    when:
      tool: WebFetch
      url_regex: '^http://(?!localhost|127\.0\.0\.1|\[::1\])'
    action: warn
    reason: "HTTP(평문) fetch. MITM/injection 위험."

  # 도구-카테고리 정합성 (시나리오 1의 더 robust 버전)
  - id: search-intent-vs-write-action
    description: 직전 의도가 검색/조회/탐색인데 파괴적 도구 호출
    when:
      tool: [Bash, Write, Edit]
      command_regex: '(rm\s+-rf|>\s*\.ssh/authorized_keys|git\s+push\s+--force|git\s+reset\s+--hard|drop\s+table)'
    intent_check:
      mode: absent_keyword
      keywords: ["삭제", "delete", "remove", "force push", "리셋", "reset", "초기화"]
      threshold: 1   # 위 키워드가 없으면 매치
    action: deny
    reason: "직전 의도에 파괴적 행위 표명이 없는데 파괴적 도구 호출. 환각/하이재킹 의심."

  # 일반 안전망
  - id: bash-rm-rf-root
    description: rm -rf / 등 절대 시스템 손상
    when:
      tool: Bash
      command_regex: 'rm\s+-rf?\s+(/|/\*|~$|~/\s|--no-preserve-root)'
    action: deny
    reason: "시스템 디렉토리 강제 삭제. 의도 무관 절대 차단."
