# mcpredict 기본 정책 — baseline.yaml
# 작성: 세션-B, 2026-04-26 (v1.0)
# ARCHITECTURE.md v1.1 §4.3 스키마 + V2 발견(`tool_input.description`) 반영
#
# 매칭 키:
#   when.tool: 도구 이름 (Bash | Write | Edit | Read | WebFetch | Glob | Grep | mcp__* | any | [list])
#   when.command_regex      : Bash.command 매칭
#   when.file_path_regex    : Write/Edit/Read.file_path 매칭
#   when.url_regex          : WebFetch.url 매칭
#   when.description_regex  : tool_input.description 매칭 (LLM이 자체 첨부한 의도 요약, V2)
#   when.contains_secret    : scanner.Scan 결과 하나 이상 매치
#   when.sequence_prior     : { tool, file_path_regex, within } — 동일 세션 직전 N개 호출
#
# intent_check (직전 assistant 메시지 매칭):
#   mode: required_keyword | absent_keyword | none
#   keywords: [...]
#   threshold: int (default 1)
#   동작: required_keyword/absent_keyword 모두 "키워드가 의도에 충분히 표명되지 않으면 룰 적용".
#   의미적 차이만 있음 (required=명시 필요, absent=명시되지 않은 것을 의심). 동작은 동일.
#
# action: allow | warn | deny

version: 1
rules:

  # 시나리오 1 (강화) — curl + 실행 컨텍스트 결합 검증
  # 매치: (a) curl ... | sh|bash|zsh|env  (pipe 형태)
  #       (b) <(curl ...)                  (process substitution)
  #       (c) $(curl ...)                  (command substitution, 결과를 평가하는 컨텍스트)
  - id: bash-curl-pipe-shell
    description: "외부 스크립트 다운로드+직접 실행. pipe·process·command substitution 모두 차단 (FN 보강 16:30)."
    when:
      tool: Bash
      command_regex: '\bcurl\b[^|]*\|\s*(?:sh|bash|zsh|env)|<\([^)]*\bcurl\b|\$\([^)]*\bcurl\b'
    intent_check:
      mode: required_keyword
      keywords: ["install", "설치", "setup", "공식 설치", "official install", "rustup", "nvm", "uv", "bun"]
      threshold: 1
    action: deny
    reason: "외부 스크립트의 직접 실행 패턴. 직전 의도에 install/setup 표명이 없음 — 의도-행위 불일치."

  - id: bash-curl-pipe-shell-description-mismatch
    description: "tool_input.description이 'install'을 표방하지만 실제 command가 의심스런 도메인"
    when:
      tool: Bash
      command_regex: '\bcurl\b[^|]*\|\s*(?:sh|bash|zsh)'
      description_regex: '(?i)\binstall(ing)?\b'
    intent_check:
      mode: required_keyword
      keywords: ["install", "설치", "setup"]
      threshold: 1
    action: warn
    reason: "description은 install이지만 직전 assistant 의도에 동일 키워드 부재 — description 위장 가능성. 사용자 확인."

  - id: bash-wget-pipe-shell
    description: "wget+pipe·substitution 동일 패턴 (FN 보강 16:30)"
    when:
      tool: Bash
      command_regex: '\bwget\b[^|]*\|\s*(?:sh|bash|zsh)|<\([^)]*\bwget\b|\$\([^)]*\bwget\b'
    intent_check:
      mode: required_keyword
      keywords: ["install", "설치", "setup"]
      threshold: 1
    action: deny
    reason: "외부 스크립트 다운로드+실행. 의도 미표명."

  # 시나리오 2: 자격증명 외부 전송
  - id: secret-in-tool-input
    description: "tool_input 자체에 자격증명/PII가 평문으로 들어가는 경우"
    when:
      tool: any
      contains_secret: true
    action: deny
    reason: "도구 인자에 자격증명/PII 평문 노출. scanner 매치."

  - id: webfetch-after-secret-read
    description: "env/credentials 파일 읽기 직후 외부 fetch — 외부 전송 시그니처"
    when:
      tool: WebFetch
      sequence_prior:
        tool: Read
        file_path_regex: '(\.env(\.[a-z]+)?$|credentials|\.aws/|\.ssh/id_)'
        within: 3
    action: deny
    reason: "자격증명 파일 읽기 직후 외부 fetch — 자격증명 외부 전송 패턴."

  - id: bash-env-cat-and-curl
    description: "cat .env | curl 또는 env | curl — 환경변수 외부 전송"
    when:
      tool: Bash
      command_regex: '(cat\s+[^|]*\.env|env\s*\|).*\|\s*curl'
    action: deny
    reason: "환경변수/자격증명을 외부로 전송하는 명령."

  # 시나리오 3 보조 — WebFetch HTTP(평문) 경고 (RE2: negative lookahead 미지원이므로
  # localhost 제외는 단순 패턴으로 분리. 본 룰은 모든 http://만 잡고, 정책 매처 후처리 또는
  # 별도 allowlist 룰에서 면제 처리하는 전략. 9시간 MVP 단순화.)
  - id: webfetch-http-plaintext
    description: "HTTP(평문) fetch — MITM/injection 위험"
    when:
      tool: WebFetch
      url_regex: '^http://'
    action: warn
    reason: "HTTP 평문 fetch. 응답이 신뢰할 수 없으므로 PostToolUse에서 injection 검증 강화 필요."

  # 도구-카테고리 정합성 (시나리오 1의 더 robust 버전)
  # FP 보강 16:35: 명령 시작(^) 또는 separator(;|&&|`|$() 뒤 위치만 매치 — echo 인자 안의 string은 면제.
  - id: search-intent-vs-write-action
    description: "직전 의도가 검색/조회/탐색인데 파괴적 도구 호출"
    when:
      tool: [Bash, Write, Edit]
      command_regex: '(?:^|[;&`]|\$\()\s*(rm\s+-rf|git\s+push\s+--force|git\s+reset\s+--hard|drop\s+table)|>\s*\.ssh/authorized_keys'
    intent_check:
      mode: absent_keyword
      keywords: ["삭제", "delete", "remove", "force push", "리셋", "reset", "초기화"]
      threshold: 1
    action: deny
    reason: "직전 의도에 파괴적 행위 표명이 없는데 파괴적 도구 호출. 환각/하이재킹 의심."

  # 일반 안전망 (의도 무관 절대 차단)
  # FP 보강 16:35: 시작·separator 위치만 매치 — echo "rm -rf /" 같은 documentation 통과.
  - id: bash-rm-rf-root
    description: "rm -rf / 등 절대 시스템 손상"
    when:
      tool: Bash
      command_regex: '(?:^|[;&`]|\$\()\s*rm\s+-rf?\s+(/(\s|$|\*)|--no-preserve-root)'
    action: deny
    reason: "시스템 디렉토리 강제 삭제. 의도 무관 절대 차단."

  # MCP 도구 룰 (mcp__* glob 매칭 — internal/policy의 toolMatches 함수에서 처리)
  # ARCHITECTURE OQ-2: tool_input 키맵은 server-defined dynamic. 가장 흔한 키(path, content, url)로 매칭.
  - id: mcp-filesystem-write-ssh-keys
    description: "MCP filesystem write가 ~/.ssh/ 또는 authorized_keys에 쓰기 시도"
    when:
      tool: "mcp__filesystem__*"
      file_path_regex: '\.ssh/(authorized_keys|id_[a-z]+)$'
    action: deny
    reason: "MCP filesystem이 SSH 키 경로에 쓰기 — 권한 상승 시도 의심."

  - id: mcp-github-public-secret
    description: "MCP GitHub create_issue/comment에 자격증명 평문 포함"
    when:
      tool: "mcp__github__*"
      contains_secret: true
    action: deny
    reason: "MCP GitHub 호출 인자에 자격증명 평문 노출 — 공개 issue/comment에 leak 위험."

